services:
  postgres:
    image: postgres:16
    container_name: dealflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow123
      POSTGRES_DB: dealflow360
    ports:
      - "5433:5432"
    volumes:
      - dealflow360-postgres-data:/var/lib/postgresql/data

volumes:
  dealflow360-postgres-data:
